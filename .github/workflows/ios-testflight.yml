# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
# The owner has no Mac, so this is the only iOS build path. Run it by hand from
# the Actions tab. Setup steps and the four secrets are in mobile/IOS-BUILD.md.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      compile_only:
        description: "Compile without signing or uploading (no Apple secrets needed)"
        type: boolean
        default: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund

      - name: Build web assets and sync the iOS project
        run: npm --prefix mobile run sync:ios

      - name: Compile without signing
        if: inputs.compile_only
        run: |
          xcodebuild build \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Check secrets
        if: ${{ !inputs.compile_only }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then echo "::error::Secret ASC_KEY_P8_BASE64 is not set"; exit 1; fi

      - name: Install App Store Connect API key
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # Archive unsigned. Automatic signing at archive time wants a development
      # profile, which Apple refuses to make for a team with no registered
      # devices. The export step below signs for App Store distribution instead.
      - name: Archive
        if: ${{ !inputs.compile_only }}
        run: |
          xcodebuild archive \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export and upload to TestFlight
        if: ${{ !inputs.compile_only }}
        run: |
          plutil -replace teamID -string "$APPLE_TEAM_ID" mobile/ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist mobile/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
